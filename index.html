<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doãn Quảng IOT</title>
  <style>
    :root {
      --primary: #00f2ff;
      --secondary: #ff00ff;
      --bg-dark: #050505;
      --glass: rgba(20, 20, 20, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --success: #00ff9d;
      --danger: #ff0055;
      --card-bg: rgba(30, 30, 30, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 242, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 255, 0.15) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Animated Background Grid */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -2;
      pointer-events: none;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      font-style: italic;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--primary), #fff, var(--secondary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 5s linear infinite;
      text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
      letter-spacing: 1px;
      text-align: center;
    }
    @keyframes shine { to { background-position: 200% center; } }

    .clock {
      font-family: 'Courier New', monospace;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 25px;
      text-shadow: 0 0 10px var(--primary);
      background: rgba(0,0,0,0.3);
      padding: 5px 20px;
      border-radius: 50px;
      border: 1px solid var(--glass-border);
    }

    .date {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 5px;
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 50px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      flex: 1 1 350px;
      max-width: 500px;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      opacity: 0.8;
    }

    .card h3 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .card h3 svg { fill: var(--primary); width: 20px; height: 20px; }

    /* Mode Switch */
    .mode-toggle-btn {
      width: 100%;
      padding: 15px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
      border-radius: 15px;
      font-size: 1.1rem;
      margin-bottom: 15px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .mode-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .mode-toggle-btn.active-auto {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
      border-color: transparent;
      color: #fff;
    }

    /* Status Text */
    .status-box {
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--primary);
      color: #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px; height: 8px; background: var(--success); border-radius: 50%;
      box-shadow: 0 0 10px var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Pump Controls */
    .pump-grid {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.03);
      padding: 12px;
      border-radius: 15px;
      border: 1px solid transparent;
      transition: 0.3s;
    }
    .pump-grid:hover { border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); }
    
    .pump-label { font-weight: 600; color: #eee; font-size: 1rem; }
    
    .btn {
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      color: white;
      min-width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
      position: relative;
      overflow: hidden;
    }
    
    /* Button Ripple Effect */
    .btn::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s;
    }
    .btn:active::after { width: 150px; height: 150px; }
    
    .btn:active { transform: scale(0.94); }
    
    .btn-on { 
      background: rgba(0, 255, 157, 0.15); 
      color: var(--success); 
      border: 1px solid rgba(0, 255, 157, 0.3);
    }
    .btn-on:hover { 
      background: var(--success); 
      color: #000; 
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.4); 
    }
    
    .btn-off { 
      background: rgba(255, 0, 85, 0.15); 
      color: var(--danger); 
      border: 1px solid rgba(255, 0, 85, 0.3);
    }
    
    /* Status Indicator Circle */
    .status-indicator {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background-color: #333;
      border: 1px solid rgba(255,255,255,0.1);
      transition: all 0.3s;
    }
    .status-indicator.on { background-color: var(--success); box-shadow: 0 0 10px var(--success); border-color: var(--success); }
    .status-indicator.off { background-color: var(--danger); box-shadow: 0 0 10px var(--danger); border-color: var(--danger); }

    .btn-off:hover { 
      background: var(--danger); 
      color: #fff; 
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); 
    }
    
    /* Active State for Status Display */
    .btn.active-state {
      filter: brightness(1.3);
      border: 2px solid #fff;
      box-shadow: 0 0 15px currentColor;
      transform: scale(1.05);
    }

    /* Inputs */
    .input-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 5px 0;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      padding: 5px 10px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }
    input[type="number"] {
      background: transparent;
      border: none;
      color: #fff;
      width: 50px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
    }
    input[type="number"]:focus { outline: none; }
    
    /* Save Button */
    .save-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      border: none;
      border-radius: 15px;
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 10px 30px rgba(0, 242, 255, 0.2);
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .save-btn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 15px 40px rgba(0, 242, 255, 0.4); 
    }
    .save-btn:active { transform: translateY(1px); }

    .hidden { display: none; }
    .icon { width: 18px; height: 18px; fill: currentColor; }
    
    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 50px;
      padding: 16px;
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      font-size: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      opacity: 0;
      transition: opacity 0.3s, bottom 0.3s;
    }
    #toast.show {
      visibility: visible;
      opacity: 1;
      bottom: 50px;
    }
    #toast.success { background: rgba(16, 185, 129, 0.9); backdrop-filter: blur(10px); }
    #toast.error { background: rgba(239, 68, 68, 0.9); backdrop-filter: blur(10px); }

    .btn-sync {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 20px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 0 auto 20px auto;
    }
    .btn-sync:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }

    /* Responsive Design for Mobile */
    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 2rem; }
      .clock { font-size: 1.5rem; margin-bottom: 15px; }
      .card { padding: 15px; border-radius: 16px; flex: 1 1 100%; max-width: 100%; }
      .btn { padding: 8px 10px; min-width: 70px; font-size: 0.8rem; }
      .pump-grid { gap: 6px; padding: 8px; }
      .pump-label { font-size: 0.9rem; }
      .input-group { flex-direction: column; align-items: flex-start; gap: 5px; }
      .input-wrapper { width: 100%; justify-content: center; padding: 8px; }
      .mode-toggle-btn { font-size: 0.95rem; padding: 12px; }
      .save-btn { font-size: 1rem; padding: 14px; }
    }
  </style>
</head>
<body>
  <h1>Doãn Quảng IOT</h1>
  <div id="date" class="date">--/--/----</div>
  <div id="clock" class="clock">--:--:--</div>
  <button class="btn-sync" onclick="syncTime()">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 20c4.42 0 8-3.58 8-8s-3.58-8-8-8-8 3.58-8 8 3.58 8 8 8zm0-14c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6 2.69-6 6-6zm-1 2v5l4.2 2.5.75-1.23-3.45-2.05V8h-1.5z"/></svg>
    Đồng bộ thời gian
  </button>

  <div class="container">
    <!-- STATUS CARD -->
    <div class="card">
      <h3><svg class="icon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg> TRẠNG THÁI</h3>
      <button id="btn-mode-toggle" class="mode-toggle-btn" onclick="toggleMode()">CHẾ ĐỘ: THỦ CÔNG</button>
      <div class="status-box">
        <div class="status-dot"></div>
        <span id="status-text">Đang kết nối...</span>
        <span id="countdown" style="margin-left: 8px; color: var(--secondary); font-weight: bold; font-family: monospace; font-size: 1.1rem;"></span>
        <span id="temp-text" style="margin-left: auto; font-weight: bold; color: var(--primary);"></span>
      </div>
    </div>

    <!-- MANUAL PANEL -->
    <div id="manual-panel" class="card">
      <h3><svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg> ĐIỀU KHIỂN</h3>
      
      <!-- SLAVE 1 -->
      <div style="color: var(--primary); margin: 10px 0 15px; font-weight: 700; letter-spacing: 1px; font-size: 0.9rem;">SLAVE 1</div>
      <div class="pump-grid"><div id="led-s1-p1" class="status-indicator off"></div><div class="pump-label">Van 1</div><button id="btn-s1-p1-on" class="btn btn-on" onclick="ctrl(1,1,1)">BẬT</button><button id="btn-s1-p1-off" class="btn btn-off" onclick="ctrl(1,1,0)">TẮT</button></div>
      <div class="pump-grid"><div id="led-s1-p2" class="status-indicator off"></div><div class="pump-label">Van 2</div><button id="btn-s1-p2-on" class="btn btn-on" onclick="ctrl(1,2,1)">BẬT</button><button id="btn-s1-p2-off" class="btn btn-off" onclick="ctrl(1,2,0)">TẮT</button></div>
      <div class="pump-grid"><div id="led-s1-p3" class="status-indicator off"></div><div class="pump-label">Van 3</div><button id="btn-s1-p3-on" class="btn btn-on" onclick="ctrl(1,3,1)">BẬT</button><button id="btn-s1-p3-off" class="btn btn-off" onclick="ctrl(1,3,0)">TẮT</button></div>
      <div class="pump-grid"><div id="led-s1-p4" class="status-indicator off"></div><div class="pump-label">Van 4</div><button id="btn-s1-p4-on" class="btn btn-on" onclick="ctrl(1,4,1)">BẬT</button><button id="btn-s1-p4-off" class="btn btn-off" onclick="ctrl(1,4,0)">TẮT</button></div>

      <!-- SLAVE 2 -->
      <div style="color: var(--secondary); margin: 25px 0 15px; font-weight: 700; letter-spacing: 1px; font-size: 0.9rem;">SLAVE 2</div>
      <div class="pump-grid"><div id="led-s2-p1" class="status-indicator off"></div><div class="pump-label">Van 1</div><button id="btn-s2-p1-on" class="btn btn-on" onclick="ctrl(2,1,1)">BẬT</button><button id="btn-s2-p1-off" class="btn btn-off" onclick="ctrl(2,1,0)">TẮT</button></div>
      <div class="pump-grid"><div id="led-s2-p2" class="status-indicator off"></div><div class="pump-label">Van 2</div><button id="btn-s2-p2-on" class="btn btn-on" onclick="ctrl(2,2,1)">BẬT</button><button id="btn-s2-p2-off" class="btn btn-off" onclick="ctrl(2,2,0)">TẮT</button></div>
      <div class="pump-grid"><div id="led-s2-p3" class="status-indicator off"></div><div class="pump-label">Van 3</div><button id="btn-s2-p3-on" class="btn btn-on" onclick="ctrl(2,3,1)">BẬT</button><button id="btn-s2-p3-off" class="btn btn-off" onclick="ctrl(2,3,0)">TẮT</button></div>
      <div class="pump-grid"><div id="led-s2-p4" class="status-indicator off"></div><div class="pump-label">Van 4</div><button id="btn-s2-p4-on" class="btn btn-on" onclick="ctrl(2,4,1)">BẬT</button><button id="btn-s2-p4-off" class="btn btn-off" onclick="ctrl(2,4,0)">TẮT</button></div>

      <!-- MASTER -->
      <div style="color: #fff; margin: 25px 0 15px; font-weight: 700; letter-spacing: 1px; font-size: 0.9rem;">BƠM TỔNG (MASTER)</div>
      <div class="pump-grid" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);">
        <div id="led-master" class="status-indicator off"></div><div class="pump-label">Bơm Chính</div>
        <button id="btn-master-on" class="btn btn-on" onclick="ctrlMaster(1)">BẬT</button>
        <button id="btn-master-off" class="btn btn-off" onclick="ctrlMaster(0)">TẮT</button>
      </div>
    </div>

    <!-- AUTO PANEL -->
    <div id="auto-panel" class="card hidden">
      <h3><svg class="icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg> CẤU HÌNH TỰ ĐỘNG</h3>
      <p style="color:#aaa; font-size:0.9rem; margin-bottom:25px; line-height: 1.5;">
        Chu trình: Slave (20s) ➔ Master (30p) ➔ Lặp lại
      </p>
      
      <div class="input-group">
        <label>Giờ chạy Sáng</label>
        <div class="input-wrapper">
          <input type="number" id="mh" min="0" max="23" placeholder="HH">
          <span>:</span>
          <input type="number" id="mm" min="0" max="59" placeholder="MM">
        </div>
      </div>
      
      <div class="input-group">
        <label>Giờ chạy Chiều</label>
        <div class="input-wrapper">
          <input type="number" id="eh" min="0" max="23" placeholder="HH">
          <span>:</span>
          <input type="number" id="em" min="0" max="59" placeholder="MM">
        </div>
      </div>
      
      <div style="height: 1px; background: var(--glass-border); margin: 20px 0;"></div>
      
      <div class="input-group">
        <label>Thời gian Bơm Master</label>
        <div class="input-wrapper">
          <input type="number" id="mt" min="1" max="120">
          <span style="font-size: 0.8rem; color: #aaa;">Phút</span>
        </div>
      </div>

      <button class="save-btn" onclick="saveConfig()">LƯU CÀI ĐẶT</button>
    </div>
  </div>

  <div id="toast">Đã lưu cài đặt!</div>

  <script>
    let currentMode = 0;

    function showToast(msg, type = 'success') {
      const x = document.getElementById("toast");
      x.innerText = msg;
      x.className = "show " + type;
      setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    function updateUI(data) {
      currentMode = data.mode;
      document.getElementById('clock').innerText = data.time;
      document.getElementById('status-text').innerText = data.status;
      
      // Hiển thị đếm ngược
      if (data.remain !== undefined && data.remain > 0) {
        let m = Math.floor(data.remain / 60);
        let s = data.remain % 60;
        document.getElementById('countdown').innerText = `[${m}:${s.toString().padStart(2, '0')}]`;
      } else {
        document.getElementById('countdown').innerText = "";
      }

      if (data.temp) {
        document.getElementById('temp-text').innerText = data.temp.toFixed(1) + "°C";
      }
      const modeBtn = document.getElementById('btn-mode-toggle');
      
      if(data.mode == 1) {
        modeBtn.innerText = "ĐANG CHẠY TỰ ĐỘNG (NHẤN ĐỂ DỪNG)";
        modeBtn.classList.add('active-auto');
        
        // Hiển thị panel điều khiển nhưng vô hiệu hóa thao tác (chỉ để xem trạng thái)
        const manualPanel = document.getElementById('manual-panel');
        manualPanel.classList.remove('hidden');
        manualPanel.style.pointerEvents = 'none'; // Không cho bấm
        manualPanel.style.opacity = '0.8'; // Làm mờ nhẹ
        document.querySelector('#manual-panel h3').lastChild.textContent = " GIÁM SÁT HOẠT ĐỘNG";

        document.getElementById('auto-panel').classList.remove('hidden');
      } else {
        modeBtn.innerText = "CHẾ ĐỘ: THỦ CÔNG (NHẤN ĐỂ AUTO)";
        modeBtn.classList.remove('active-auto');
        
        const manualPanel = document.getElementById('manual-panel');
        manualPanel.classList.remove('hidden');
        manualPanel.style.pointerEvents = 'auto'; // Cho phép bấm
        manualPanel.style.opacity = '1';
        document.querySelector('#manual-panel h3').lastChild.textContent = " ĐIỀU KHIỂN";

        document.getElementById('auto-panel').classList.add('hidden');
      }

      // Update Pump Status
      if (data.slaves) {
        for(let s=0; s<2; s++) {
          for(let p=0; p<4; p++) {
            let isOn = data.slaves[s][p] == 1;
            let btnOn = document.getElementById(`btn-s${s+1}-p${p+1}-on`);
            let btnOff = document.getElementById(`btn-s${s+1}-p${p+1}-off`);
            if(btnOn && btnOff) {
               btnOn.classList.toggle('active-state', isOn);
               btnOff.classList.toggle('active-state', !isOn);
            }
            let led = document.getElementById(`led-s${s+1}-p${p+1}`);
            if(led) {
              led.className = 'status-indicator ' + (isOn ? 'on' : 'off');
            }
          }
        }
      }
      if (data.master !== undefined) {
         let mOn = document.getElementById('btn-master-on');
         let mOff = document.getElementById('btn-master-off');
         if(mOn && mOff) {
            let isMOn = data.master == 1;
            mOn.classList.toggle('active-state', isMOn);
            mOff.classList.toggle('active-state', !isMOn);
            let ledM = document.getElementById('led-master');
            if(ledM) {
              ledM.className = 'status-indicator ' + (isMOn ? 'on' : 'off');
            }
         }
      }
      
      // Only update inputs if not focused to avoid jumping values while typing
      if (document.activeElement.tagName !== 'INPUT') {
        document.getElementById('mh').value = data.mh;
        document.getElementById('mm').value = data.mm;
        document.getElementById('eh').value = data.eh;
        document.getElementById('em').value = data.em;
        document.getElementById('mt').value = data.mt;
      }
    }

    function fetchStatus() {
      fetch('/status')
        .then(r => r.json())
        .then(data => updateUI(data))
        .catch(e => console.log(e));
    }

    function setMode(m) {
      fetch('/mode?val=' + m).then(() => fetchStatus());
    }

    function toggleMode() {
      let newMode = currentMode == 1 ? 0 : 1;
      setMode(newMode);
      let targetMode = currentMode == 1 ? "THỦ CÔNG" : "TỰ ĐỘNG";
      if (confirm("Bạn có chắc chắn muốn chuyển sang chế độ " + targetMode + " không?")) {
        let newMode = currentMode == 1 ? 0 : 1;
        setMode(newMode);
      }
    }

    function ctrl(slave, pump, state) {
      fetch(`/control?slave=${slave}&pump=${pump}&state=${state}`);
    }
    
    function ctrlMaster(state) {
      fetch(`/control_master?state=${state}`);
    }

    function saveConfig() {
      let mh = document.getElementById('mh').value;
      let mm = document.getElementById('mm').value;
      let eh = document.getElementById('eh').value;
      let em = document.getElementById('em').value;
      let mt = document.getElementById('mt').value;
      let url = `/config?mh=${mh}&mm=${mm}&eh=${eh}&em=${em}&mt=${mt}`;
      fetch(url)
        .then(response => {
          if (response.ok) showToast("Đã lưu cài đặt thành công!", "success");
          else showToast("Lỗi khi lưu!", "error");
        })
        .catch(() => showToast("Mất kết nối!", "error"));
    }

    function syncTime() {
      const d = new Date();
      const url = `/sync_time?y=${d.getFullYear()}&m=${d.getMonth()+1}&d=${d.getDate()}&h=${d.getHours()}&mi=${d.getMinutes()}&s=${d.getSeconds()}`;
      fetch(url)
        .then(r => {
          if(r.ok) showToast("Đã đồng bộ thời gian!", "success");
          else showToast("Lỗi đồng bộ!", "error");
        })
        .catch(() => showToast("Lỗi kết nối!", "error"));
    }

    setInterval(fetchStatus, 2000);
    fetchStatus();
  </script>
</body>
</html>
